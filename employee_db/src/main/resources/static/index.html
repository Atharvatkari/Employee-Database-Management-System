<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('https://www.example.com/path-to-your-background-image.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            padding: 0;
            margin: 0;
        }
        .navbar {
            background-color: #0d6efd;
            padding: 10px 20px;
        }
        .navbar h1 {
            color: #fff;
            font-size: 28px;
            margin: 0;
        }
        .container {
            margin-top: 30px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 20px;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border: none;
        }
        .card-header {
            background-color: #0d6efd;
            color: white;
            font-size: 20px;
        }
        .btn-primary {
            background-color: #28a745;
            border: none;
        }
        .btn-primary:hover {
            background-color: #218838;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .form-control, .form-label {
            font-size: 1rem;
        }
        .form-control-file {
            font-size: 1rem;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #6c757d;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Employee Database Management System</h1>
    </div>

    <div class="container">
        <div class="card mb-4">
            <div class="card-header">Register New Employee</div>
            <div class="card-body">
                <form id="employeeForm">
                    <div class="mb-3">
                        <label for="employeeId" class="form-label">Employee ID</label>
                        <input type="text" id="employeeId" class="form-control" required placeholder="Enter Employee ID">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" id="name" class="form-control" required placeholder="Enter Name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required placeholder="Enter Email">
                    </div>
                    <div class="mb-3">
                        <label for="designation" class="form-label">Designation</label>
                        <input type="text" id="designation" class="form-control" required placeholder="Enter Designation">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" id="phone" class="form-control" required placeholder="Enter Phone Number">
                    </div>
                    <div class="mb-3">
                        <label for="employeeImage" class="form-label">Upload Employee Image</label>
                        <input type="file" id="employeeImage" class="form-control-file" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register Employee</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Employee Management System. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('employeeForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Get form values
            const employeeId = document.getElementById('employeeId').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const designation = document.getElementById('designation').value;
            const phone = document.getElementById('phone').value;
            const employeeImage = document.getElementById('employeeImage').files[0];

            // Validate form fields
            if (!employeeId || !name || !email || !designation || !phone || !employeeImage) {
                alert('Please fill in all fields and upload an image.');
                return;
            }

            // Simulate form submission to success page
            setTimeout(() => {
                alert('Employee registered successfully!');
                window.location.href = 'success.html'; // Redirect to success page after registration
            }, 500);
        });
    </script>
</body>
</html>
