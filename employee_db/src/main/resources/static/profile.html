<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Update</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles for a clean, professional look */
        body {
            background-color: #f7f9fc;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #1f4e79;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 24px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .text-center img {
            border-radius: 50%;
            margin-bottom: 15px;
            width: 150px; /* consistent size for the profile image */
            height: 150px;
            object-fit: cover;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
        }

        /* For responsive layout */
        @media (max-width: 576px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Update Profile</h1>
    </div>

    <div class="container">
        <form id="profileForm" enctype="multipart/form-data">
            <!-- Profile Photo -->
            <div class="mb-3 text-center">
                <img src="images/profile-placeholder.png" alt="Profile Photo" id="profilePhoto" class="rounded-circle">
                <input type="file" id="photoUpload" class="form-control mt-3" accept="image/*" onchange="previewImage(event)">
            </div>
            
            <!-- Name Field -->
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
            </div>

            <!-- Address Field -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" class="form-control" placeholder="Enter your address" required>
            </div>

            <!-- Phone Field -->
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" id="phone" class="form-control" placeholder="Enter your phone number" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>

    <footer>
        <p>Employee Management System &copy; 2024</p>
    </footer>

    <script src="js/profile.js"></script>
    <script>
        // Preview the selected image for the profile photo
        function previewImage(event) {
            const output = document.getElementById('profilePhoto');
            output.src = URL.createObjectURL(event.target.files[0]);
        }

        document.getElementById('profileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Profile updated successfully!');
        });
    </script>
</body>
</html>
